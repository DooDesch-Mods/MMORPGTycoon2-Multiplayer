name: Windows source checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build and run C++ source tests
        run: |
          $python = (Get-Command python -CommandType Application).Source
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products * -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -or -not $visualStudio) { throw 'Visual Studio 2022 C++ toolchain not found' }
          Import-Module (Join-Path $visualStudio 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $visualStudio -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $parallel = [Math]::Min(4, [Environment]::ProcessorCount)
          Write-Output "Building C++ tests with Ninja, MSVC x64 and $parallel workers"
          cmake -S ci -B .ci-build/tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl "-DPython3_EXECUTABLE=$python"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build .ci-build/tests --parallel $parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir .ci-build/tests --output-on-failure --timeout 60
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  python-tests:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: tools/mcp/requirements.txt
      - name: Install diagnostic test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r tools/mcp/requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run Python source and packaging tests
        run: |
          python -m unittest discover -s test -p test_build_input_guard.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s test/mcp -p test_installed_profile.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'tools/mcp'
          python -X utf8 -m unittest discover -s test/mcp -p test_status_publication.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s test/mcp -p test_runtime.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s test/mcp -p test_read_retry.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s test/mcp -p test_tutorial_observer.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 test/mcp/test_tutorial_network_tab.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 test/mcp/test_monster_zone_probe.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 test/mcp/test_monster_zone_ui.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 test/mcp/test_developer_staff.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 test/mcp/test_developer_retirement.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 test/mcp/test_developer_ui.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 test/mcp/test_bug_policy.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 test/mcp/test_bug_fix_ui.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 test/mcp/test_bug_completion_readback.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 test/mcp/test_bug_repair_acceptance.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 test/mcp/test_research_acceptance.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 test/mcp/test_subscriber.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 test/local_acceptance_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s test/e2e -p test_building_history.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s test -p test_loader_separation.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s test -p test_beta_milestone.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s test -p test_beta_release.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s test -p test_framework_beta.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tools/packaging -p test_package.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tools/packaging -p test_steam_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  compile:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Read pinned Framework SDK identity
        id: sdk
        run: |
          $pin = Get-Content -LiteralPath .github/framework-sdk.json -Raw | ConvertFrom-Json
          if ($pin.repository -ne 'DooDesch-Mods/MMORPGTycoon2-ModFramework' -or $pin.revision -notmatch '^[0-9a-f]{40}$') { throw 'Invalid Framework SDK identity' }
          "revision=$($pin.revision)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Read pinned public Framework SDK
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: DooDesch-Mods/MMORPGTycoon2-ModFramework
          ref: ${{ steps.sdk.outputs.revision }}
          path: .ci-deps/framework
          persist-credentials: false
      - name: Restore SDL import library
        id: sdl_import
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: include/vendor/SDL3/lib/x64/SDL3.lib
          key: Windows-x64-windows2022-msvc14-SDL-a8589a84226a6202831a3d49ff4edda4acab9acd-schema-v1
      - name: Read official SDL source
        if: steps.sdl_import.outputs.cache-hit != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: libsdl-org/SDL
          ref: a8589a84226a6202831a3d49ff4edda4acab9acd # release-3.2.24
          path: .ci-deps/sdl
          persist-credentials: false
      - name: Build external SDL import library
        if: steps.sdl_import.outputs.cache-hit != 'true'
        run: |
          cmake -S .ci-deps/sdl -B .ci-build/sdl -A x64 -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build .ci-build/sdl --config Release --target SDL3-shared --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $libraries = @(Get-ChildItem -LiteralPath .ci-build/sdl -Recurse -File -Filter SDL3.lib)
          if ($libraries.Count -ne 1) { throw "Expected exactly one SDL import library, found $($libraries.Count)" }
          New-Item -ItemType Directory -Force -Path include/vendor/SDL3/lib/x64 | Out-Null
          Copy-Item -LiteralPath $libraries[0].FullName -Destination include/vendor/SDL3/lib/x64/SDL3.lib
      - name: Verify SDL import library
        run: |
          $library = Get-Item -LiteralPath include/vendor/SDL3/lib/x64/SDL3.lib -ErrorAction Stop
          if ($library.PSIsContainer -or ($library.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $library.Length -le 0) {
            throw 'SDL import library must be a nonempty regular file'
          }
      - name: Compile native Framework plugin
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          python .github/scripts/framework_beta.py build --sdk .ci-deps/framework --commit $env:BUILD_COMMIT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Keep exact native build for packaging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multiplayer-framework-build
          path: |
            .ci-build/mod/bin/Release/MT2MultiplayerPlugin.dll
            .ci-build/mod/bin/Release/framework-build.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 0
  build:
    if: always()
    needs: [source-tests, python-tests, compile]
    runs-on: ubuntu-latest
    steps:
      - name: Require all Windows checks
        env:
          SOURCE_TESTS_RESULT: ${{ needs.source-tests.result }}
          COMPILE_RESULT: ${{ needs.compile.result }}
          PYTHON_TESTS_RESULT: ${{ needs.python-tests.result }}
        run: |
          if [ "$SOURCE_TESTS_RESULT" != success ] || [ "$PYTHON_TESTS_RESULT" != success ] || [ "$COMPILE_RESULT" != success ]; then
            echo "::error::Windows checks failed: source-tests=$SOURCE_TESTS_RESULT python-tests=$PYTHON_TESTS_RESULT compile=$COMPILE_RESULT"
            exit 1
          fi
