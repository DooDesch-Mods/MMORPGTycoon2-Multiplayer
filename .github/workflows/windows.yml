name: Windows source checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      beta_release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.ci-cache/sccache
      SCCACHE_CACHE_SIZE: 4G
      SCCACHE_DIRECT: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: tools/mcp/requirements.txt
      - name: Install Python test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r tools/mcp/requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Read pinned Framework SDK identity
        id: sdk
        run: |
          $pin = Get-Content -LiteralPath .github/framework-sdk.json -Raw | ConvertFrom-Json
          if ($pin.repository -ne 'DooDesch-Mods/MMORPGTycoon2-ModFramework' -or $pin.revision -notmatch '^[0-9a-f]{40}$') { throw 'Invalid Framework SDK identity' }
          "revision=$($pin.revision)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Read pinned public Framework SDK
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: DooDesch-Mods/MMORPGTycoon2-ModFramework
          ref: ${{ steps.sdk.outputs.revision }}
          path: .ci-deps/framework
          persist-credentials: false
      - name: Restore SDL import library
        id: sdl_import
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: include/vendor/SDL3/lib/x64/SDL3.lib
          key: Windows-x64-windows2022-msvc14-SDL-a8589a84226a6202831a3d49ff4edda4acab9acd-schema-v1
      - name: Read official SDL source
        if: steps.sdl_import.outputs.cache-hit != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: libsdl-org/SDL
          ref: a8589a84226a6202831a3d49ff4edda4acab9acd # release-3.2.24
          path: .ci-deps/sdl
          persist-credentials: false
      - name: Build external SDL import library
        if: steps.sdl_import.outputs.cache-hit != 'true'
        run: |
          cmake -S .ci-deps/sdl -B .ci-build/sdl -A x64 -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build .ci-build/sdl --config Release --target SDL3-shared --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $libraries = @(Get-ChildItem -LiteralPath .ci-build/sdl -Recurse -File -Filter SDL3.lib)
          if ($libraries.Count -ne 1) { throw "Expected exactly one SDL import library, found $($libraries.Count)" }
          New-Item -ItemType Directory -Force -Path include/vendor/SDL3/lib/x64 | Out-Null
          Copy-Item -LiteralPath $libraries[0].FullName -Destination include/vendor/SDL3/lib/x64/SDL3.lib
      - name: Verify SDL import library
        run: |
          $library = Get-Item -LiteralPath include/vendor/SDL3/lib/x64/SDL3.lib -ErrorAction Stop
          if ($library.PSIsContainer -or ($library.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $library.Length -le 0) {
            throw 'SDL import library must be a nonempty regular file'
          }
      - name: Restore compiled objects
        id: object_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache/sccache
          key: windows-sccache-v2-${{ runner.os }}-x64-msvc-${{ github.sha }}
          restore-keys: |
            windows-sccache-v2-${{ runner.os }}-x64-msvc-
      - name: Install pinned compiler cache
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.18.0
      - name: Build plugin, build and run C++ tests
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          $python = Join-Path $env:pythonLocation 'python.exe'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products * -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -or -not $visualStudio) { throw 'Visual Studio 2022 C++ toolchain not found' }
          Import-Module (Join-Path $visualStudio 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $visualStudio -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $parallel = [Environment]::ProcessorCount
          sccache --zero-stats
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python .github/scripts/framework_beta.py build --ci-ninja --sdk .ci-deps/framework --commit $env:BUILD_COMMIT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S ci -B .ci-build/tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_POLICY_DEFAULT_CMP0141=NEW '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=$<$<CONFIG:Debug,RelWithDebInfo>:Embedded>' "-DPython3_EXECUTABLE=$python" "-DMT2MP_ORDERED_FRAMEWORK_SDK=$env:GITHUB_WORKSPACE/.ci-deps/framework"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build .ci-build/tests --parallel $parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir .ci-build/tests -C Release --no-tests=error --output-on-failure --timeout 60 -j $parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run Python tests
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'tools/mcp'
          # One process per file: the test/mcp modules share module state and fail when loaded together.
          # Files without a TestCase are scripts and run directly.
          $failed = 0
          foreach ($f in Get-ChildItem test, tools -Recurse -File -Filter 'test_*.py') {
            if (Select-String -Quiet -SimpleMatch 'TestCase' -LiteralPath $f.FullName) {
              python -X utf8 -m unittest discover -s $f.DirectoryName -p $f.Name
            } else {
              python -X utf8 $f.FullName
            }
            if ($LASTEXITCODE) { Write-Host "::error::$($f.FullName) failed with exit code $LASTEXITCODE"; $failed++ }
          }
          if ($failed) { Write-Host "::error::$failed Python test files failed"; exit 1 }
      - name: Record compiler cache statistics
        if: always()
        run: |
          if (-not (Get-Command sccache -ErrorAction SilentlyContinue)) { throw 'Compiler cache setup did not complete; statistics unavailable' }
          sccache --show-stats
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # main saves after every push; other refs save only when nothing was restored, so PRs read main's
      # cache and the repository stays under the 10 GB cache limit. always() keeps a timed-out cold build.
      - name: Save compiled objects
        if: ${{ always() && steps.object_cache.outcome == 'success' && steps.object_cache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.object_cache.outputs.cache-matched-key == '') }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cache/sccache
          key: ${{ steps.object_cache.outputs.cache-primary-key }}
      - name: Keep exact native build for packaging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multiplayer-framework-build
          path: |
            .ci-build/mod-forced/bin/Release/MT2MultiplayerPlugin.dll
            .ci-build/mod-forced/bin/Release/framework-build.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 0
