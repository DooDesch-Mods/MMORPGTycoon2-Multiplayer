name: Early Beta release

on:
  push:
    branches: [main]
    paths: ['.github/beta-milestone.json']
    tags:
      - 'v*-beta.*'

permissions:
  contents: read

concurrency:
  group: early-beta-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'DooDesch-Mods/MMORPGTycoon2-Multiplayer'
    uses: ./.github/workflows/windows.yml

  release:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Select explicit beta version
        id: beta
        env:
          BETA_REF: ${{ github.ref }}
        run: python .github/scripts/beta_milestone.py resolve --ref "$BETA_REF" --output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: multiplayer-framework-build
          path: .ci-build/mod/bin/Release
      - name: Package the checked Framework build
        env:
          BETA_TAG: ${{ steps.beta.outputs.tag }}
          BETA_COMMIT: ${{ github.sha }}
        run: python .github/scripts/framework_beta.py package --tag "$BETA_TAG" --commit "$BETA_COMMIT" --build .ci-build/mod/bin/Release --output artifacts/beta
      - name: Bind milestone tag to built source
        if: steps.beta.outputs.milestone == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_TAG: ${{ steps.beta.outputs.tag }}
          BETA_COMMIT: ${{ github.sha }}
        run: python .github/scripts/beta_milestone.py ensure-tag --tag "$BETA_TAG" --commit "$BETA_COMMIT"
      - name: Publish Early Beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_TAG: ${{ steps.beta.outputs.tag }}
          BETA_COMMIT: ${{ github.sha }}
          BETA_MILESTONE: ${{ steps.beta.outputs.milestone }}
        run: |
          arguments=(.github/scripts/publish_beta.py --tag "$BETA_TAG" --commit "$BETA_COMMIT" --directory artifacts/beta)
          if [ "$BETA_MILESTONE" = true ]; then arguments+=(--milestone .github/beta-milestone.json); fi
          python "${arguments[@]}"
