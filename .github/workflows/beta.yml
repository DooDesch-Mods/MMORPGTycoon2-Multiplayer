name: Private beta release

on:
  push:
    branches: [main]
    paths: ['.github/beta-milestone.json']
    tags:
      - 'v*-beta.*'

permissions:
  contents: read

concurrency:
  group: private-beta-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'DooDesch/MMORPGTycoon2-Multiplayer' && github.event.repository.private
    outputs:
      tag: ${{ steps.beta.outputs.tag }}
      milestone: ${{ steps.beta.outputs.milestone }}
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Select explicit beta version
        id: beta
        env:
          BETA_REF: ${{ github.ref }}
        run: |
          python .github/scripts/beta_milestone.py resolve --ref $env:BETA_REF --output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and run source checks
        run: |
          cmake -S ci -B .ci-build/tests -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build .ci-build/tests --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir .ci-build/tests -C Release --output-on-failure --timeout 60
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s test -p test_build_input_guard.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s test/mcp -p test_installed_profile.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s test -p test_beta_milestone.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s test -p test_beta_release.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tools/packaging -p test_package.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tools/packaging -p test_steam_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Restore SDL import library
        id: sdl_import
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: include/vendor/SDL3/lib/x64/SDL3.lib
          key: Windows-x64-windows2022-msvc14-SDL-a8589a84226a6202831a3d49ff4edda4acab9acd-schema-v1
      - name: Read official SDL source
        if: steps.sdl_import.outputs.cache-hit != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: libsdl-org/SDL
          ref: a8589a84226a6202831a3d49ff4edda4acab9acd # release-3.2.24
          path: .ci-deps/sdl
          persist-credentials: false
      - name: Build SDL import library
        if: steps.sdl_import.outputs.cache-hit != 'true'
        run: |
          cmake -S .ci-deps/sdl -B .ci-build/sdl -A x64 -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build .ci-build/sdl --config Release --target SDL3-shared --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $libraries = @(Get-ChildItem -LiteralPath .ci-build/sdl -Recurse -File -Filter SDL3.lib)
          if ($libraries.Count -ne 1) { throw "Expected exactly one SDL import library, found $($libraries.Count)" }
          New-Item -ItemType Directory -Force -Path include/vendor/SDL3/lib/x64 | Out-Null
          Copy-Item -LiteralPath $libraries[0].FullName -Destination include/vendor/SDL3/lib/x64/SDL3.lib
      - name: Verify SDL import library
        run: |
          $library = Get-Item -LiteralPath include/vendor/SDL3/lib/x64/SDL3.lib -ErrorAction Stop
          if ($library.PSIsContainer -or ($library.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $library.Length -le 0) {
            throw 'SDL import library must be a nonempty regular file'
          }
      - name: Build mod and drop-in loader
        env:
          BETA_TAG: ${{ steps.beta.outputs.tag }}
          BETA_COMMIT: ${{ github.sha }}
        run: |
          python .github/scripts/build_beta.py --tag $env:BETA_TAG --commit $env:BETA_COMMIT --build-only --mode dropin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package exact tagged build
        env:
          BETA_TAG: ${{ steps.beta.outputs.tag }}
          BETA_COMMIT: ${{ github.sha }}
        run: |
          python .github/scripts/build_beta.py --tag $env:BETA_TAG --commit $env:BETA_COMMIT --mode dropin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Keep checked beta payload for release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-beta
          path: |
            artifacts/beta/*.zip
            artifacts/beta/*.zip.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: private-beta
          path: artifacts/beta
      - name: Bind milestone tag to built source
        if: needs.build.outputs.milestone == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_TAG: ${{ needs.build.outputs.tag }}
          BETA_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          python .github/scripts/beta_milestone.py ensure-tag --tag $env:BETA_TAG --commit $env:BETA_COMMIT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish private prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_TAG: ${{ needs.build.outputs.tag }}
          BETA_COMMIT: ${{ github.sha }}
          BETA_MILESTONE: ${{ needs.build.outputs.milestone }}
        shell: pwsh
        run: |
          $arguments = @('.github/scripts/publish_beta.py', '--tag', $env:BETA_TAG, '--commit', $env:BETA_COMMIT, '--directory', 'artifacts/beta')
          if ($env:BETA_MILESTONE -eq 'true') { $arguments += @('--milestone', '.github/beta-milestone.json') }
          python @arguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
