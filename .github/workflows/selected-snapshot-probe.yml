name: Selected snapshot diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  selected-snapshot:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install source extraction dependencies
        run: |
          python -m pip install --disable-pip-version-check -r tools/mcp/requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Reproduce selected-save failure on the Windows runner
        run: |
          $python = Join-Path $env:pythonLocation 'python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'Configured Python interpreter not found' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products * -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -or -not $visualStudio) { throw 'Visual Studio 2022 C++ toolchain not found' }
          Import-Module (Join-Path $visualStudio 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $visualStudio -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $parallel = [Math]::Min(4, [Environment]::ProcessorCount)
          Write-Output "Building C++ tests with Ninja, MSVC x64 and $parallel workers"
          cmake -S ci -B .ci-build/tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl "-DPython3_EXECUTABLE=$python"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build .ci-build/tests --parallel 2 --target test_selected_snapshot
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($attempt in 1..3) {
            ctest --test-dir .ci-build/tests -C Release -R "^selected_snapshot$" --output-on-failure --timeout 60 --output-junit ".ci-build/tests/selected-snapshot-$attempt.xml"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Retain exact diagnostic and synthetic fixture files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: selected-snapshot-diagnostic
          retention-days: 7
          path: |
            .ci-build/tests/selected-snapshot-*.xml
            .ci-build/tests/selected_snapshot_files
          if-no-files-found: error
