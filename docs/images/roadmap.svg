<text x="440" y="332" font-family="Arial" font-size="22" fill="#b8cad8" font-weight="400">More complete save</text>
<text x="440" y="361" font-family="Arial" font-size="22" fill="#b8cad8" font-weight="400">support</text>
<circle cx="828" cy="118" r="14" fill="#0b1723" stroke="#a8c1d5" stroke-width="3"/>
<text x="812" y="172" font-family="Arial" font-size="23" fill="#a8c1d5" font-weight="700">Longer term</text>
<text x="812" y="212" font-family="Arial" font-size="27" fill="#f2f7fb" font-weight="700">Grow your world</text>
