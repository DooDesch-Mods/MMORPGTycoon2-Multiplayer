<text x="48" y="332" font-family="Arial" font-size="22" fill="#b8cad8" font-weight="400">Shared pause and speed</text>
<path d="M436 118h392" stroke="#ffca67" stroke-width="2" stroke-dasharray="6" opacity=".5"/>
<circle cx="436" cy="118" r="14" fill="#0b1723" stroke="#ffca67" stroke-width="3"/>
<circle cx="436" cy="118" r="5" fill="#ffca67"/>
<text x="420" y="172" font-family="Arial" font-size="23" fill="#ffca67" font-weight="700">Next priorities</text>
<text x="420" y="212" font-family="Arial" font-size="27" fill="#f2f7fb" font-weight="700">A living world</text>
<circle cx="425" cy="246" r="3" fill="#ffca67"/>
<text x="440" y="254" font-family="Arial" font-size="22" fill="#b8cad8" font-weight="400">Live monster gameplay</text>
<circle cx="425" cy="285" r="3" fill="#ffca67"/>
<text x="440" y="293" font-family="Arial" font-size="22" fill="#b8cad8" font-weight="400">More NPC and quest tools</text>
