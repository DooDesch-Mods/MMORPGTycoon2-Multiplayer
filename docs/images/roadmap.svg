<text x="28" y="212" font-family="Arial" font-size="27" fill="#f2f7fb" font-weight="700">Build together</text>
<circle cx="33" cy="246" r="3" fill="#64e4d5"/>
<text x="48" y="254" font-family="Arial" font-size="22" fill="#b8cad8" font-weight="400">Steam lobbies and worlds</text>
<circle cx="33" cy="285" r="3" fill="#64e4d5"/>
<text x="48" y="293" font-family="Arial" font-size="22" fill="#b8cad8" font-weight="400">Buildings and regions</text>
