<circle cx="32" cy="438" r="5" fill="#ffca67"/>
<text x="76" y="444" font-family="Arial" font-size="23" fill="#ffca67" font-weight="700">Next priorities</text>
<text x="76" y="484" font-family="Arial" font-size="27" fill="#f2f7fb" font-weight="700">A living world</text>
