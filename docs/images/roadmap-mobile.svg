<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1030" viewBox="0 0 600 1030" role="img" aria-labelledby="title description">
<title id="title">MMORPG Tycoon 2 Multiplayer roadmap</title>
<desc id="description">Available now: Build together. Steam lobbies and worlds; Buildings and regions; Shared pause and speed. Next priorities: A living world. Live monster gameplay; More NPC and quest tools; More complete save support. Longer term: Grow your world. More building tools; More gameplay systems; Four-player, larger worlds</desc>
<path fill="#0b1723" d="M0 0h600v1030H0z"/>
<g font-family="Arial">
<text x="28" y="46" font-family="Arial" font-size="30" fill="#f2f7fb" font-weight="700">The road to a shared MMO world.</text>
<text x="28" y="80" font-family="Arial" font-size="22" fill="#b8cad8" font-weight="400">Early Beta 17 - Build, copy and clear together</text>
<path d="M32 152v286" stroke="#64e4d5" stroke-width="2" stroke-dasharray="0" opacity=".5"/>
