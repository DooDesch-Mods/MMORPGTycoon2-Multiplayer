<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1030" viewBox="0 0 600 1030" role="img" aria-labelledby="title description">
<title id="title">MMORPG Tycoon 2 Multiplayer roadmap</title>
<desc id="description">Play now: Build together. Copy buildings and props; Group, erase and undo; Buy regions, build roads. In development: Build in more ways. Modular blocks and doors; Save modular worlds; Construction and right-click. Later: Grow your world. Join a running world later; Four-player sessions; Larger worlds under load</desc>
